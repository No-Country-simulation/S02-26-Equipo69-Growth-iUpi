<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iUpi | Growth Command Center</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="layout">

    <div class="overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        
        <div class="sidebar-header">
            <div class="logo">
                <i class="fa-solid fa-rocket"></i>
                <span>iUpi Admin</span>
            </div>

            <button class="close-sidebar-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <nav class="menu">
            <div class="menu-item active">
                <i class="fa-solid fa-chart-pie"></i>
                <span class="menu-text">Dashboard</span>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-users"></i>
                <span class="menu-text">Leads</span>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-gear"></i>
                <span class="menu-text">Configuración</span>
            </div>
        </nav>

        <button class="collapse-btn desktop-only" onclick="toggleSidebar()">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

    </aside>

    <main class="main-content">

        <header class="header">
            <div class="header-left">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                
                <div class="header-title-group">
                    <h1>Estado Waitlist <span class="live-dot"></span></h1>
                    <p>Monitoreo en tiempo real</p>
                </div>
            </div>

            <button class="refresh-btn" onclick="cargarDatos()">
                <i class="fa-solid fa-rotate-right"></i>
                <span class="btn-text">Actualizar</span>
            </button>
        </header>

        <section class="kpi-grid">
            <div class="card kpi-card">
                <div class="kpi-icon"><i class="fa-solid fa-users"></i></div>
                <div>
                    <span class="kpi-label">Total Registrados</span>
                    <h2 id="totalDisplay">--</h2>
                    <span class="kpi-trend" id="trendDisplay">--</span>
                </div>
            </div>

            <div class="card kpi-card">
                <div class="kpi-icon"><i class="fa-solid fa-bullhorn"></i></div>
                <div>
                    <span class="kpi-label">Canal Top</span>
                    <h2 id="topChannelDisplay">--</h2>
                    <span class="kpi-muted">Mayor conversión</span>
                </div>
            </div>

            <div class="card kpi-card">
                <div class="kpi-icon success"><i class="fa-solid fa-server"></i></div>
                <div>
                    <span class="kpi-label">Estado API</span>
                    <h2 class="success">Online</h2>
                    <span class="kpi-muted">Firebase Firestore</span>
                </div>
            </div>
        </section>

        <section class="charts-grid">
            <div class="card chart-card">
                <h3>Adquisición por Canal</h3>
                <div class="chart-wrapper">
                    <canvas id="barChart"></canvas>
                </div>
            </div>

            <div class="card chart-card">
                <h3>Distribución</h3>
                <div class="chart-wrapper">
                    <canvas id="doughnutChart"></canvas>
                </div>
            </div>
        </section>

    </main>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>
